<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUBIN Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="intro-section" id="intro">
    <div class="intro-copy">
      <p>PORTFOLIO</p>
      <h1>
        Every click<br />
        has a reason.
      </h1>
    </div>

    <div class="card-stage">
      <div class="back-message">
        클릭 한 번에도<br />
        이유가 있어야 한다고 믿습니다.
      </div>

      <div class="card-stack">

        <!-- 가장 먼저 떨어지는 명함 카드 -->
        <button class="project-card name-card main-card" data-category="all">
          <div class="name-card-top">
            <p>CONNECT STORIES!<br />MAKE CULTURE</p>
            <p>VARIETY<br />IDEAL</p>
            <p>ENJOYABLE<br />BENEFICIAL</p>
          </div>

          <div class="subin-logo">
            SUBIN
          </div>

          <span>All Works</span>
        </button>

        <button class="project-card card-1" data-category="poster">
          <span>Poster</span>
        </button>

        <button class="project-card card-2" data-category="uxui">
          <span>UX/UI</span>
        </button>

        <button class="project-card card-3" data-category="web">
          <span>Web</span>
        </button>

        <button class="project-card card-4" data-category="graphic">
          <span>Graphic</span>
        </button>

      </div>
    </div>

    <p class="scroll-hint">Choose a card</p>
  </section>

  <section class="portfolio-section" id="portfolio">
    <div class="portfolio-header">
      <div>
        <p id="selectedCategory">Selected Works</p>
        <h2>My Projects</h2>
      </div>
      <button class="back-btn" id="backBtn">Back to cards</button>
    </div>

    <div class="project-grid">
      <article class="grid-item">
        <div class="thumb thumb-1"></div>
        <p>Project 01</p>
        <h3>Poster Design</h3>
      </article>

      <article class="grid-item">
        <div class="thumb thumb-2"></div>
        <p>Project 02</p>
        <h3>UX/UI Renewal</h3>
      </article>

      <article class="grid-item">
        <div class="thumb thumb-3"></div>
        <p>Project 03</p>
        <h3>Interactive Website</h3>
      </article>

      <article class="grid-item">
        <div class="thumb thumb-4"></div>
        <p>Project 04</p>
        <h3>Graphic System</h3>
      </article>

      <article class="grid-item">
        <div class="thumb thumb-5"></div>
        <p>Project 05</p>
        <h3>Visual Archive</h3>
      </article>

      <article class="grid-item">
        <div class="thumb thumb-6"></div>
        <p>Project 06</p>
        <h3>Brand Concept</h3>
      </article>
    </div>
  </section>

  <div class="transition-card" id="transitionCard"></div>

  <script src="script.js"></script>
</body>
</html>
